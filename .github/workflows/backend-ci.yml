name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sica-backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sica-backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sica-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format . --check

      - name: Run MyPy (type checking)
        run: mypy .

      - name: Run Tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./sica-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: python -c "import server; import ai_engine; import audio_processor; print('All imports successful')"

      - name: Check model file exists
        run: test -f sica_acoustic_model.pt && echo "Model file exists" || echo "Model file missing (will be generated on first run)"
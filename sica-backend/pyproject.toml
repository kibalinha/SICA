[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sica-backend"
version = "1.2.0"
description = "SICA Backend - API de Análise Espectral e IA de Áudio"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SICA Team", email = "team@sica.example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "av>=12.0.0",
    "torch>=2.2.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "limits>=5.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "httpx2>=0.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/sica/sica-backend"
Repository = "https://github.com/sica/sica-backend"
Issues = "https://github.com/sica/sica-backend/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [
    ".venv",
    "venv",
    ".pytest_cache",
    "__pycache__",
    "*.pyc",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet (will be ignored if pandas not used)
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # numpy
    "TCH", # torch
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
    "C901",  # too complex (allow for AI engine)
    "T201",  # print (used in training script)
    "S101",  # assert (used in tests)
    "PLW2901", # loop variable overwrites
    "PLR2004", # magic values: thresholds de áudio (dBA/SNR/probabilidades) são constantes de domínio
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201", "NPY002", "PLC0415", "E402", "B905", "PLR1714"]
"ai_engine.py" = ["TRY003", "PLW0603", "PLC0415", "PLR0915", "PLR0912", "ARG001"]  # singleton via global; import lazy opcional; heurística complexa
"audio_processor.py" = ["TRY003", "TRY300", "PLR0911", "PLR0913", "PLR0917", "PLC0415", "PLR0915", "PLR0912"]  # regras de decisão e import lazy do PyAV
"server.py" = ["TRY003", "TRY300", "TRY301"]  # mensagens de erro detalhadas mantidas de propósito
"test_*.py" = ["E402", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["sica"]
combine-as-imports = true

[tool.mypy]
# Stubs do numpy 2.x usam 'type' statement (Python 3.12+)
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
allow_untyped_decorators = true
allow_untyped_globals = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "librosa.*",
    "soundfile.*",
    "av.*",
    "slowapi.*",
    "limits.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/__pycache__/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]